services:
  mysql:
    image: mysql:8.0
    container_name: fullstack-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      app-network:
        aliases:
          - mysql
          - fullstack-mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT}
    container_name: fullstack-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT}
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    networks:
      app-network:
        aliases:
          - backend
          - fullstack-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT}
        FRONTEND_PORT: ${FRONTEND_PORT}
    container_name: fullstack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      app-network:
        aliases:
          - frontend
          - fullstack-frontend

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge
